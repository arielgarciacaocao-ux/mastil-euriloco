# Compila Mástil y deja el APK para descargar.
# Se ejecuta solo con cada cambio, o a mano desde la pestaña «Actions» › «Compilar Mástil» › «Run workflow».
name: Compilar Mástil

on:
  push:
    paths:
      - "mastil/**"
      - ".github/workflows/mastil-apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar el APK
        run: gradle -p mastil assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mastil-apk
          path: mastil/app/build/outputs/apk/debug/app-debug.apk
