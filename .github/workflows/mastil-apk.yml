# Compila Mástil y deja el APK para descargar.
# Se ejecuta solo con cada cambio, o a mano desde la pestaña «Actions» › «Compilar Mástil» › «Run workflow».
name: Compilar Mástil

on:
  push:
    paths:
      - "mastil/**"
      - ".github/workflows/mastil-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar el APK
        run: gradle -p mastil assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mastil-apk
          path: mastil/app/build/outputs/apk/debug/app-debug.apk

      # Deja siempre la última versión en Releases, para bajarla directo desde el teléfono.
      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mastil/app/build/outputs/apk/debug/app-debug.apk mastil.apk
          gh release delete mastil-ultima --yes --cleanup-tag || true
          gh release create mastil-ultima mastil.apk \
            --title "Mástil · última versión" \
            --notes "Instalador de Mástil compilado a partir de ${GITHUB_SHA::7}. Desde el teléfono: tocá mastil.apk para descargarlo e instalarlo." \
            --target "$GITHUB_SHA"
